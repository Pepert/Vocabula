services:
  api:
    build:
      context: .
      target: final

    image: vocabula-api:local

    env_file:
      - .env

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__VocabulaDb: >-
        Host=postgres;
        Port=5432;
        Database=vocabula;
        Username=vocabula;
        Password=${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5001:8080"

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: vocabula
      POSTGRES_USER: vocabula
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - vocabula-db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabula -d vocabula"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vocabula-db: