version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Routine updates arrive as a single PR instead of one per action.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Routine updates arrive as a single PR instead of one per package.
      # Major version bumps stay as individual PRs for explicit review.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Swashbuckle.AspNetCore 10.x compiles against Microsoft.OpenApi 2.7.5;
      # a 3.x runtime produces MissingMethodException when generating the
      # OpenAPI document. Revisit when a Swashbuckle release targets 3.x.
      - dependency-name: "Microsoft.OpenApi"
        versions: ["[3.0.0,)"]
